# Settings ng StayTrack. Baguhin yung values tapos i-run yung app.

# --- Server ---
server.port=1012
spring.application.name=staytrack

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/staytrack
spring.datasource.username=postgres
spring.datasource.password=_rLpHyn09
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# "none" kasi tayo ang gumagawa ng tables sa schema.sql.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Schema bootstrap: tumatakbo yung schema.sql tuwing start ---
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# --- File uploads ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# --- Email / Gmail SMTP ---
# Ilagay dito yung Gmail mo at yung 16-char na App Password.
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=giannnn1205@gmail.com
spring.mail.password=hnqxztpaqavvpajd
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Application settings (prefix: app.)

# Kapag true at walang SMTP, ipinapakita yung OTP para makapag-test.
app.dev-show-otp=false

# Dapat 32+ characters. Gumawa gamit: openssl rand -hex 32
app.jwt.secret=change-me-to-a-long-random-secret-at-least-32-characters
app.jwt.expiration-days=7

app.otp.length=6
app.otp.ttl-minutes=10
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

app.mail.from-name=StayTrack
app.mail.from-email=giannnn1205@gmail.com

app.upload-dir=uploads
app.max-upload-mb=10

# Extra origins na pwedeng tumawag sa API.
app.cors-origins=http://localhost:5500,http://127.0.0.1:5500

# Gumagawa ng admin account sa first run, walang demo data.
app.seed.enabled=true

# Yung admin account; gagawin isang beses lang at hindi na babaguhin.
app.seed.admin-email=admin@staytrack.local
app.seed.admin-password=ADMIN@@
