<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — StayTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <a class="brand" href="/">Stay<span class="accent">Track</span></a>
        <h1 class="auth-title">Reset your password</h1>
        <p class="auth-sub">Enter the code we emailed you, then choose a new password.</p>
      </div>

      <div class="alert" id="alert"></div>

      <form id="resetForm" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input class="control" type="email" id="email" required />
        </div>

        <div class="field">
          <label>Reset code</label>
          <div class="otp-inputs" id="otpInputs">
            <input maxlength="1" inputmode="numeric" />
            <input maxlength="1" inputmode="numeric" />
            <input maxlength="1" inputmode="numeric" />
            <input maxlength="1" inputmode="numeric" />
            <input maxlength="1" inputmode="numeric" />
            <input maxlength="1" inputmode="numeric" />
          </div>
        </div>

        <div class="field">
          <label for="password">New password</label>
          <input class="control" type="password" id="password" placeholder="9+ characters, 1 uppercase letter" required />
        </div>

        <button class="btn btn-accent btn-block btn-lg" type="submit" id="resetBtn">Reset password</button>
      </form>

      <div class="auth-foot">
        Remembered it? <a href="/login.html">Back to login</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const form = qs('#resetForm');
    const btn = qs('#resetBtn');
    const alertBox = qs('#alert');
    const otpInputs = qsa('#otpInputs input');

    const savedEmail = sessionStorage.getItem('staytrack_reset_email') || '';
    if (savedEmail) qs('#email').value = savedEmail;

    const devOtp = sessionStorage.getItem('staytrack_reset_otp') || '';
    if (devOtp) {
      devOtp.split('').forEach((d, i) => (otpInputs[i].value = d));
      showAlert(alertBox, `Development mode — your reset code is ${devOtp}.`, 'info');
    }

    otpInputs.forEach((input, i) => {
      input.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 1);
        if (e.target.value && i < 5) otpInputs[i + 1].focus();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && i > 0) otpInputs[i - 1].focus();
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert(alertBox);

      const email = qs('#email').value.trim();
      const code = otpInputs.map((i) => i.value).join('');
      const password = qs('#password').value;

      if (!email || code.length !== 6 || password.length <= 8) {
        return showAlert(alertBox, 'Fill in your email, the 6-digit code and a password longer than 8 characters.');
      }
      if (!/[A-Z]/.test(password)) {
        return showAlert(alertBox, 'Password must contain at least one uppercase letter (A-Z).');
      }

      setLoading(btn, true, 'Resetting…');
      try {
        await api.post('/auth/reset-password', { email, code, password }, { auth: false });
        sessionStorage.removeItem('staytrack_reset_email');
        sessionStorage.removeItem('staytrack_reset_otp');
        showAlert(alertBox, 'Password reset! Redirecting to login…', 'success');
        setTimeout(() => (location.href = '/login.html'), 1200);
      } catch (err) {
        setLoading(btn, false);
        showAlert(alertBox, err.message || 'Could not reset the password.');
      }
    });
  </script>
</body>
</html>
