<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create account — StayTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <a class="brand" href="/">Stay<span class="accent">Track</span></a>
        <h1 class="auth-title" id="pageTitle">Create your account</h1>
        <p class="auth-sub" id="pageSub">Sign up as a resident. We'll email you a code to verify it's really you.</p>
      </div>

      <div class="alert" id="alert"></div>

      <!-- Step 1: details -->
      <form id="signupForm" novalidate>
        <div class="row-2">
          <div class="field">
            <label for="firstName">First name</label>
            <input class="control" type="text" id="firstName" placeholder="Alex" required />
          </div>
          <div class="field">
            <label for="lastName">Last name</label>
            <input class="control" type="text" id="lastName" placeholder="Rivera" required />
          </div>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input class="control" type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="phone">Phone number</label>
          <input class="control" type="tel" id="phone" placeholder="+63 912 345 6789" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input class="control" type="password" id="password" placeholder="9+ characters, 1 uppercase letter" autocomplete="new-password" required />
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input class="control" type="password" id="confirmPassword" placeholder="Repeat your password" autocomplete="new-password" required />
        </div>

        <button class="btn btn-accent btn-block btn-lg" type="submit" id="signupBtn">Create account</button>
      </form>

      <!-- Step 2: OTP -->
      <form id="otpForm" novalidate style="display:none;">
        <p class="auth-sub" style="margin-bottom:18px;">
          Enter the 6-digit code we sent to <strong id="otpEmailLabel"></strong>.
        </p>

        <div class="field">
          <label>Verification code</label>
          <div class="otp-inputs" id="otpInputs">
            <input maxlength="1" inputmode="numeric" />
            <input maxlength="1" inputmode="numeric" />
            <input maxlength="1" inputmode="numeric" />
            <input maxlength="1" inputmode="numeric" />
            <input maxlength="1" inputmode="numeric" />
            <input maxlength="1" inputmode="numeric" />
          </div>
        </div>

        <button class="btn btn-accent btn-block btn-lg" type="submit" id="otpBtn">Verify email</button>

        <div class="auth-foot">
          Didn't get it? <a href="#" id="resendLink">Resend code</a>
          <span id="cooldown" class="muted"></span>
        </div>
        <div class="auth-foot" style="margin-top:8px;">
          <a href="#" id="changeEmailLink">&larr; Use a different email</a>
        </div>
      </form>

      <div class="auth-foot" id="loginFoot">
        Already have an account? <a href="/login.html">Log in</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const signupForm = qs('#signupForm');
    const otpForm = qs('#otpForm');
    const signupBtn = qs('#signupBtn');
    const otpBtn = qs('#otpBtn');
    const alertBox = qs('#alert');
    const otpInputs = qsa('#otpInputs input');

    let pendingEmail = sessionStorage.getItem('staytrack_pending_email') || '';
    let cooldownTimer = null;

    /* --- Pagpalit ng step --- */
    function showStep(step, email) {
      if (email) pendingEmail = email;
      const verifying = step === 'verify';

      signupForm.style.display = verifying ? 'none' : 'block';
      otpForm.style.display = verifying ? 'block' : 'none';
      qs('#loginFoot').style.display = verifying ? 'none' : 'block';
      qs('#pageTitle').textContent = verifying ? 'Verify your email' : 'Create your account';
      qs('#pageSub').textContent = verifying
        ? 'One quick step to secure your account.'
        : "Sign up as a resident. We'll email you a code to verify it's really you.";

      if (verifying) {
        qs('#otpEmailLabel').textContent = pendingEmail;
        otpInputs[0].focus();
        startCooldown(60);
      }
      window.scrollTo({ top: 0 });
    }

    // Galing sa login page.
    const params = new URLSearchParams(location.search);
    if (params.get('step') === 'verify') {
      showStep('verify', params.get('email') || pendingEmail);
    }

    /* --- Galaw ng OTP boxes --- */
    otpInputs.forEach((input, i) => {
      input.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 1);
        if (e.target.value && i < otpInputs.length - 1) otpInputs[i + 1].focus();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && i > 0) otpInputs[i - 1].focus();
        if (e.key === 'ArrowLeft' && i > 0) otpInputs[i - 1].focus();
        if (e.key === 'ArrowRight' && i < otpInputs.length - 1) otpInputs[i + 1].focus();
      });
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6).split('');
        digits.forEach((d, idx) => (otpInputs[idx].value = d));
        otpInputs[Math.min(digits.length, 5)].focus();
      });
    });

    function readOtp() {
      return otpInputs.map((i) => i.value).join('');
    }

    /* --- Submit ng signup --- */
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert(alertBox);

      const firstName = qs('#firstName').value.trim();
      const lastName = qs('#lastName').value.trim();
      const email = qs('#email').value.trim();
      const phone = qs('#phone').value.trim();
      const password = qs('#password').value;
      const confirmPassword = qs('#confirmPassword').value;

      if (!firstName || !lastName || !email || !phone || !password) {
        return showAlert(alertBox, 'Please fill in all fields, including your phone number.');
      }
      if (password.length <= 8) {
        return showAlert(alertBox, 'Password must be more than 8 characters.');
      }
      if (!/[A-Z]/.test(password)) {
        return showAlert(alertBox, 'Password must contain at least one uppercase letter (A-Z).');
      }
      if (password !== confirmPassword) {
        return showAlert(alertBox, 'Passwords do not match.');
      }

      setLoading(signupBtn, true, 'Creating account…');
      try {
        const data = await api.post('/auth/signup', { firstName, lastName, email, phone, password }, { auth: false });
        sessionStorage.setItem('staytrack_pending_email', data.email || email);
        if (data.devOtp) sessionStorage.setItem('staytrack_pending_otp', data.devOtp);
        setLoading(signupBtn, false);

        if (data.devOtp) {
          // Dev mode, auto-fill yung code para madali mag-test.
          data.devOtp.split('').forEach((d, i) => (otpInputs[i].value = d));
          showAlert(alertBox, `Development mode — your code is ${data.devOtp}.`, 'info');
        } else {
          showAlert(alertBox, 'Account created! Check your inbox for the 6-digit code.', 'success');
        }
        showStep('verify', data.email || email);
      } catch (err) {
        setLoading(signupBtn, false);
        const detail = err.details ? Object.values(err.details)[0] : null;
        showAlert(alertBox, detail || err.message || 'Signup failed.');
      }
    });

    /* --- Submit ng OTP --- */
    otpForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert(alertBox);
      const code = readOtp();
      if (code.length !== 6) return showAlert(alertBox, 'Please enter all 6 digits.');

      setLoading(otpBtn, true, 'Verifying…');
      try {
        const data = await api.post('/auth/verify-otp', { email: pendingEmail, code }, { auth: false });
        Store.save(data);
        sessionStorage.removeItem('staytrack_pending_email');
        sessionStorage.removeItem('staytrack_pending_otp');
        showAlert(alertBox, 'Email verified! Taking you to your dashboard…', 'success');
        setTimeout(() => (location.href = '/index.html'), 900);
      } catch (err) {
        setLoading(otpBtn, false);
        showAlert(alertBox, err.message || 'Verification failed.');
      }
    });

    /* --- Resend na may cooldown --- */
    function startCooldown(seconds) {
      clearInterval(cooldownTimer);
      let left = seconds;
      const el = qs('#cooldown');
      const render = () => {
        el.textContent = left > 0 ? ` (${left}s)` : '';
        if (left <= 0) clearInterval(cooldownTimer);
        left -= 1;
      };
      render();
      cooldownTimer = setInterval(render, 1000);
    }

    qs('#resendLink').addEventListener('click', async (e) => {
      e.preventDefault();
      hideAlert(alertBox);
      try {
        const data = await api.post('/auth/resend-otp', { email: pendingEmail, purpose: 'signup' }, { auth: false });
        if (data.devOtp) {
          data.devOtp.split('').forEach((d, i) => (otpInputs[i].value = d));
          showAlert(alertBox, `Development mode — new code is ${data.devOtp}.`, 'info');
        } else {
          showAlert(alertBox, 'A new code has been sent to your email.', 'success');
        }
        startCooldown(60);
      } catch (err) {
        showAlert(alertBox, err.message || 'Could not resend the code.');
      }
    });

    qs('#changeEmailLink').addEventListener('click', (e) => {
      e.preventDefault();
      sessionStorage.removeItem('staytrack_pending_email');
      showStep('form');
    });
  </script>
</body>
</html>
