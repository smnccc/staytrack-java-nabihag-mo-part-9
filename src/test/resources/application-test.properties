# Test profile — runs against an in-memory H2 database, no external services.
spring.datasource.url=jdbc:h2:mem:staytrack;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the schema from the entities for tests.
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# A mail host is set so the JavaMailSender bean exists, but no credentials ->
# EmailService falls back to development mode and returns a devOtp.
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=
spring.mail.password=

app.dev-show-otp=true
app.jwt.secret=test-secret-that-is-long-enough-for-hs256-0123456789
app.jwt.expiration-days=1
app.upload-dir=build/test-uploads

# The admin account. The demo tenant, rooms and unpaid bill used by the
# integration tests come from TestFixtures (test sources only).
app.seed.enabled=true
app.seed.admin-email=admin@staytrack.local
app.seed.admin-password=Admin@12345
